# gFlex configuration — 2-D example
# All units are SI.

mode:
  dimension: 2
  method: FD

parameter:
  YoungsModulus: 6.5e10
  PoissonsRatio: 0.25
  GravAccel: 9.8
  MantleDensity: 3300
  InfillMaterialDensity: 0

input:
  Loads: q0_sample/2D/diag.txt
  ElasticThickness: Te_sample/2D/fault_24-30.txt

output:
  DeflectionOut: ""
  # Plot choices: q0, w, or both
  Plot: both

numerical:
  GridSpacing_x: 4000
  BoundaryCondition_West: 0Moment0Shear
  BoundaryCondition_East: 0Displacement0Slope

numerical2D:
  GridSpacing_y: 4000
  BoundaryCondition_North: Mirror
  BoundaryCondition_South: 0Slope0Shear

verbosity:
  Verbose: false
  Debug: false
  Quiet: false
