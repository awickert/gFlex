# gFlex configuration — 1-D example
# All units are SI.

mode:
  dimension: 1
  method: FD

parameter:
  youngs_modulus: 6.5e10
  poissons_ratio: 0.25
  gravitational_acceleration: 9.8
  mantle_density: 3300
  infill_material_density: 0

input:
  loads: q0_sample/1D/central_block.txt
  elastic_thickness: Te_sample/1D/8km_20km_ramp.txt

output:
  deflection_out: ""
  # Plot choices: q0, w, both, or (for 1D) combo
  plot: combo

numerical:
  grid_spacing_x: 6000
  boundary_condition_west: periodic
  boundary_condition_east: periodic

verbosity:
  verbose: false
  debug: false
  quiet: false
