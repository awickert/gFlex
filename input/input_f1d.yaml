# gFlex configuration — 1-D example
# All units are SI.

mode:
  dimension: 1
  method: FD

parameter:
  YoungsModulus: 6.5e10
  PoissonsRatio: 0.25
  GravAccel: 9.8
  MantleDensity: 3300
  InfillMaterialDensity: 0

input:
  Loads: q0_sample/1D/central_block.txt
  ElasticThickness: Te_sample/1D/8km_20km_ramp.txt

output:
  DeflectionOut: ""
  # Plot choices: q0, w, both, or (for 1D) combo
  Plot: combo

numerical:
  GridSpacing_x: 6000
  BoundaryCondition_West: Periodic
  BoundaryCondition_East: Periodic

verbosity:
  Verbose: false
  Debug: false
  Quiet: false
