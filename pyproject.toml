[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gflex"
description = "One- and two-dimensional plate bending, designed for Earth's lithosphere"
authors = [
  {email = "awickert@umn.edu", name = "Andrew D. Wickert"},
  {email = "eric.hutton@colorado.edu", name = "Eric W. H. Hutton"},
]
maintainers = [
  {email = "awickert@umn.edu", name = "Andrew D. Wickert"},
]
keywords = [
  'geophysics',
  'geology',
  'geodynamics',
  'lithosphere',
  'isostasy',
  'GRASS GIS'
]
license = {text = "GPL-3.0-only"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
	"matplotlib",
	"numpy",
	"pyyaml",
	"scipy",
]
dynamic = ["readme", "version"]

[project.urls]
homepage = "https://github.com/awickert/gflex"
documentation = "https://gflex.readthedocs.io"
repository = "https://github.com/awickert/gflex"
changelog = "https://github.com/awickert/gflex/blob/master/CHANGES.md"

[project.optional-dependencies]
bmi = ["bmipy"]
plot = ["cmcrameri"]
dev = ["nox"]
testing = ["pytest"]
docs = [
  "sphinx>=9.1",
  "furo>=2025.12.19",
  "myst-parser>=5.0",
]

[project.scripts]
gflex = "gflex.gflex:main"

# [tool.setuptools]
# py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["gflex*"]

[tool.setuptools.dynamic]
readme = {file = ["README.md", "AUTHORS.md", "CHANGES.md"], content-type="text/markdown"}
version = {attr = "gflex._version.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["gflex", "tests"]
norecursedirs = [".*", "*.egg*", "build", "dist", "utilities"]
addopts = """
  --ignore setup.py
  --tb native
  --strict
  --durations 16
  --doctest-modules
  -vvv
"""
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ALLOW_UNICODE"
]

[tool.isort]
combine_as_imports = true
known_first_party = "gflex"
profile = "black"
